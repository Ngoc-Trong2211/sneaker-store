services:
  mysql:
    image: mysql:8
    container_name: sneaker-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    container_name: sneaker-frontend
    image: pvngoctrong/sneaker-store-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend-service
    restart: unless-stopped
    networks:
      - backend-network

  backend-service:
    container_name: sneaker-backend
    image: pvngoctrong/sneaker-store-backend:latest
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${DATABASE_URL:-jdbc:mysql://mysql:3306/sneaker_store}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:-}
      GEMINI_KEY: ${GEMINI_KEY:?GEMINI_KEY is required}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      APP_UPLOAD_DIR: file:/app/uploads/
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  mysql_data:
  uploads_data: